name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.10"
          working-directory: starter/backend

      - name: Run Flake8 Linter
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python and Install Dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.10"
          working-directory: starter/backend

      - name: Run Pytest
        working-directory: starter/backend
        run: pipenv run test

  build-push-deploy:
    name: Build, Push to ECR, and Deploy to EKS
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: starter/backend
        run: |
          docker build \
            --tag $ECR_REGISTRY/backend:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/backend:$IMAGE_TAG

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Set image tag and deploy with Kustomize
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: starter/backend/k8s
        run: |
          # Update the image in kustomization to use the new ECR image tag
          kustomize edit set image backend=$ECR_REGISTRY/backend:$IMAGE_TAG
          # Apply the manifests to the cluster
          kustomize build | kubectl apply -f -

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/backend --namespace=default --timeout=120s
