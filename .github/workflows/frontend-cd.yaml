name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

env:
  # Set the backend URL for the React app build
  REACT_APP_MOVIE_API_URL: ${{ vars.REACT_APP_MOVIE_API_URL || 'http://localhost:5000' }}

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: "18.14"
          working-directory: starter/frontend

      - name: Run ESLint
        working-directory: starter/frontend
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: "18.14"
          working-directory: starter/frontend

      - name: Run Tests
        working-directory: starter/frontend
        run: CI=true npm test

  build-push-deploy:
    name: Build, Push to ECR, and Deploy to EKS
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }} \
            --tag $ECR_REGISTRY/frontend:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/frontend:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/frontend:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Set image tag and deploy with Kustomize
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: starter/frontend/k8s
        run: |
          # Update the image in kustomization to use the new ECR image tag
          kustomize edit set image frontend=$ECR_REGISTRY/frontend:$IMAGE_TAG
          # Apply the manifests to the cluster
          kustomize build | kubectl apply -f -

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/frontend --namespace=default --timeout=120s
